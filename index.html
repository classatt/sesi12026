const fmtTime = d => {
  let h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
  const suf = h >= 12 ? 'PTG' : 'PG';
  let h12 = h % 12; if (h12 === 0) h12 = 12;

  return h12 + ':' + p(m) + ':' + p(s) + ' ' + suf;
};

const addHours = (t, h) => {
  const [hh, mm] = String(t).split(':').map(Number);
  if ([hh, mm].some(isNaN)) return t;
  const d = new Date(2020, 0, 1, hh, mm);
  d.setMinutes(d.getMinutes() + Math.round((h || 0) * 60));
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
};
const durationH = (start, end) => {
  const [sh, sm] = String(start).split(':').map(Number);
  const [eh, em] = String(end).split(':').map(Number);
  if ([sh, sm, eh, em].some(isNaN)) return 0;
  const mins = (eh * 60 + em) - (sh * 60 + sm);
  return mins > 0 ? Math.round((mins / 60) * 4) / 4 : 0;
};
const durBadge = (s, e) => {
  if (!s || !e) return '';
  const [sh, sm] = String(s).split(':').map(Number), [eh, em] = String(e).split(':').map(Number);
  if ([sh, sm, eh, em].some(isNaN)) return '';
  let d = (eh * 60 + em) - (sh * 60 + sm); if (d < 0) d += 1440;
  return Math.floor(d/60) + 'j ' + (d%60) + 'm';
};

  const ta = idToks(studentIdOf(a)), tb = idToks(studentIdOf(b));

  for (let i = 0; i < n; i++) {
    const x = ta[i], y = tb[i];
    if (/^\d+$/.test(x) && /^\d+$/.test(y)) {
      const nx = parseInt(x, 10), ny = parseInt(y, 10);
      if (nx !== ny) return nx - ny;
    } else if (x !== y) return x < y ? -1 : 1;
  }
  return ta.length - tb.length;
};

function normalizeStudent(o) {
  if (!o || typeof o !== 'object') return null;

  const id = String(o.no_matrik || '').trim();
  const name = String(o.nama || '').trim().toUpperCase();

  if (!id || !name) return null;

  return {
    // ID & nama utama
    id: id,
    name: name,

    // =========================================================
    // SUMBER / PEMILIK DATA
    // IKHWAN / SHIKIN / FAYYADH
    // =========================================================
    source_name: String(
      o.source_name || ''
    ).trim().toUpperCase(),

    // Maklumat pelajar
    nickname: String(
      o.nama_panggilan || ''
    ).trim(),

    phone: cleanPhone(
      o.no_telefon || ''
    ),

    // Mentor
    mentor: String(
      o.mentor || ''
    ).trim(),

    mentorPhone: cleanPhone(
      o.no_mentor ||
      o.no_wa_mentor ||
      ''
    ),

    // Penjaga
    guardian: String(
      o.nama_penjaga || ''
    ).trim(),

    guardianPhone: cleanPhone(
      o.no_telefon_penjaga || ''
    ),

    // Kediaman
    resident:
      String(
        o.status_kediaman || ''
      )
        .toLowerCase()
        .includes('non')
        ? 'non-resident'
        : 'resident',

    // =========================================================
    // KELAS
    // Sumber sebenar ialah REGISTERED CLASS
    // =========================================================
    kelas: String(
      o.registered_class || ''
    )
      .trim()
      .toUpperCase(),

    // Maklumat tambahan
    subjek: decSubjectFor(o),

    sesiId: String(
      o.semester || ''
    ).trim(),

    // =========================================================
    // GAMBAR
    // =========================================================
    photoFileId: extractDriveId(
      o.gambar_pelajar ||
      o.image_url_1 ||
      ''
    ),

    // Simpan data tambahan
    imageUrl1: String(
      o.image_url_1 || ''
    ).trim(),

    waStudent: String(
      o.wa_student || ''
    ).trim(),

    waParent: String(

    ).trim(),

    formatNoStud: String(
      o.format_no_stud || ''

}

function mergeStudents(sheet, local){
  const byId = {};
  (sheet||[]).forEach(s => { if (s && s.id) byId[s.id] = s; });
  (local||[]).forEach(s => { if (s && s.id) byId[s.id] = s; });
  return Object.values(byId);
}
const subjCodeOf = (c) => {
  const sn = String((c && c.subjName) || '').trim();
  if (!sn) return '';
  const i = sn.indexOf(' - ');
  return i > 0 ? sn.slice(0, i).trim() : '';
};
const classLabel = (c) => {
  if (!c) return '';
  const code = (c.code || '').trim();
  const name = (c.className || '').trim();
  const display = subjCodeOf(c) || code;
  if (display && name) return display + ' ' + name;
  return name || display || (c.className || '');
};
const normKlas = (v) => String(v || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
const groupOf = (cls) => {
  const code = normKlas(cls.code);
  const toks = String(cls.className || '').toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);
  const kept = toks.filter(t => !(code && code.includes(t)));
  return kept.join('');
};
const stuInClass = (cls, s) => {
  if (!cls || !s) return true;
  const k = normKlas(s.kelas);
  if (!k) return false;
  const code = normKlas(cls.code);
  const name = normKlas(cls.className);
  const label = normKlas(classLabel(cls));
  const prog = (code || '').replace(/\d+/g, '');
  if (name && k.includes(name)) return true;
  if (label && k.includes(label)) return true;
  const group = groupOf(cls);
  if (group && k.includes(group)) {
    if (!prog || k.includes(prog)) return true;
  }
  if (code && k.includes(code)) {
    const rem = k.replace(code, '');
    if (!rem) return true;
    return group ? (rem.includes(group) || k.includes(name)) : true;
  }
  if (k.length >= 2 && name.includes(k)) return true;
  return false;
};

function AddClassModal({ onClose, onSave, initial }) {
  const [code, setCode] = useState((initial && initial.code) || '');
  const [subjName, setSubjName] = useState((initial && initial.subjName) || '');
  const [className, setClassName] = useState((initial && initial.className) || '');
  const [lecturer, setLecturer] = useState((initial && initial.lecturer) || '');
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const isDup = !!(initial && initial.dup);

  const submit = async () => {
    if (busy) return;
    if (!code.trim()) return setErr('Subject code diperlukan.');
    if (!className.trim()) return setErr('Nama kelas diperlukan.');
    setErr(null);
    setBusy(true);
    try {
      await onSave({ code: code.trim(), subjName: subjName.trim(), className: className.trim(), lecturer: lecturer.trim(), day: 'Isnin', startTime: '08:00', endTime: '10:00', durationHours: 2, room: '' });
    } catch (e) {
      setErr('Gagal simpan: ' + (e && e.message || e));
      setBusy(false);
    }
  };
  const field = 'mt-1.5 w-full h-[44px] px-3.5 rounded-[10px] border border-line bg-white text-[14px] text-ink placeholder:text-muted/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/30';
  const lbl = 'block text-[13px] font-semibold text-ink';

  return html`
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-label="Tambah kelas">
      <div className="absolute inset-0 bg-navy/60" onClick=${onClose}></div>
      <div className="relative w-full max-w-[440px] bg-white rounded-2xl border border-line shadow-2xl overflow-hidden">
        <div className="flex items-center justify-between px-5 py-4 border-b border-line">
          <h3 className="text-[16px] font-bold text-navy tracking-tight">${isDup ? 'Duplikat Kelas' : 'Tambah Kelas Baru'}</h3>
          <button onClick=${onClose} aria-label="Tutup"
            className=${'w-9 h-9 rounded-lg flex items-center justify-center text-muted hover:bg-page transition-colors ' + FOCUS}>
            <${IC.X} className="w-5 h-5" />
          </button>
        </div>
        <div className="p-5 space-y-3.5 max-h-[70vh] overflow-y-auto">
          ${isDup ? html`<p className="text-[12.5px] font-medium text-muted bg-primary/5 border border-primary/15 rounded-lg px-3 py-2">Satu salinan kelas ini akan dibuat sebagai kelas baharu. Ubah nama kelas atau kod untuk mengelakkan pertindihan.</p>` : null}
          <div>
            <label className=${lbl}>Subject Code</label>
            <input value=${code} onChange=${e => setCode(e.target.value)} placeholder="cth: DCD2063" className=${field + ' font-mono uppercase'} autoFocus />
          </div>
          <div>
            <label className=${lbl}>Nama Subjek <span className="font-normal text-muted">(opsional)</span></label>
            <input value=${subjName} onChange=${e => setSubjName(e.target.value)} placeholder="cth: Editing and Compositing" className=${field} />
          </div>
          <div>
            <label className=${lbl}>Nama Kelas</label>
            <input value=${className} onChange=${e => setClassName(e.target.value)} placeholder="cth: 3A" className=${field} />
          </div>
          <div>
            <label className=${lbl}>Nama Pensyarah <span className="font-normal text-muted">(opsional)</span></label>
            <input value=${lecturer} onChange=${e => setLecturer(e.target.value)} placeholder="cth: Pn. Nur Syafiqah" className=${field} />
          </div>
          ${err ? html`<p className="text-[13px] font-medium text-danger">${err}</p>` : null}
        </div>
        <div className="flex justify-end gap-2 px-5 py-4 border-t border-line bg-page/60">
          <button onClick=${onClose}
            className=${'inline-flex items-center justify-center h-[44px] px-5 rounded-[9px] bg-white border border-line text-[14px] font-medium text-ink hover:bg-blue-hover transition-colors duration-200 ' + FOCUS}>Batal</button>

function SesiManager({ sessions, activeSessionId, attMap, onSetActive, onArchive, onDelete, onNew, onClose, onSetTime }) {
  const [editId, setEditId] = useState(null);
  const [eStart, setEStart] = useState('08:00');
  const [eEnd, setEEnd] = useState('10:00');
  const startEdit = (s) => { setEditId(s.id); setEStart(s.startTime || '08:00'); setEEnd(s.endTime || '10:00'); };
  const saveEdit = (s) => {
    if (onSetTime) onSetTime(s.id, eStart, eEnd);
    setEditId(null);
  };
  return html`
    <div className="fixed inset-0 z-[500] flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-label="Sesi Manager">
      <div className="absolute inset-0 bg-navy/60" onClick=${onClose}></div>

          <div className="w-10 h-10 rounded-xl bg-primary/10 border border-primary/30 flex items-center justify-center text-primary"><${IC.Archive} className="w-5 h-5" /></div>
          <div>
            <h3 className="text-[16px] font-bold text-navy">Sesi Manager</h3>
            <p className="text-[12px] text-muted mt-0.5">Senarai sesi kehadiran kelas ini</p>
          </div>
          <button onClick=${onClose} aria-label="Tutup" className=${'ml-auto w-9 h-9 rounded-lg flex items-center justify-center text-muted hover:bg-page transition-colors ' + FOCUS}><${IC.X} className="w-5 h-5" /></button>
        </div>
        <div className="p-4 border-b border-line shrink-0">
          <button onClick=${onNew} className=${'inline-flex items-center gap-2 h-[42px] px-4 rounded-[9px] bg-primary text-white text-[13px] font-medium hover:bg-primary-dark transition-colors duration-200 shadow-[0_6px_16px_-6px_rgba(37,99,235,0.55)] ' + FOCUS}>
            <${IC.Plus} className="w-4 h-4" /> Sesi Baru
          </button>

        <div className="flex-1 overflow-y-auto scroll-thin p-4 space-y-2.5">
          ${(sessions||[]).length ? (sessions||[]).map(s => {
            const dt = s.createdAt && s.createdAt.toDate ? s.createdAt.toDate() : new Date();
            const map = attMap[s.id] || {};
            const pres = Object.values(map).filter(a => a.status === 'present').length;
            const abs = Object.values(map).filter(a => a.status === 'absent').length;
            const isActive = s.id === activeSessionId;
            return html`
              <div className=${'rounded-xl border px-4 py-3 transition-colors duration-200 ' + (isActive ? 'border-primary/40 bg-blue-hover' : 'border-line bg-white')}>
                <div className="flex items-center gap-3 flex-wrap">
                  <div className="min-w-0 flex-1">
                    ${editId === s.id ? html`
                      <div className="flex items-center gap-2 flex-wrap">
                        <input type="time" value=${eStart} onChange=${e => setEStart(e.target.value)} aria-label="Masa mula"
                          className="h-[34px] px-2 rounded-[8px] border border-line bg-white text-[13px] font-mono text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/30" />
                        <span className="text-muted">–</span>
                        <input type="time" value=${eEnd} onChange=${e => setEEnd(e.target.value)} aria-label="Masa tamat"
                          className="h-[34px] px-2 rounded-[8px] border border-line bg-white text-[13px] font-mono text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/30" />
                        <button onClick=${() => saveEdit(s)} className=${'inline-flex items-center h-[34px] px-3 rounded-[8px] bg-primary text-white text-[12px] font-medium hover:bg-primary-dark transition-colors duration-200 ' + FOCUS}>
                          <${IC.Save} className="w-3.5 h-3.5 mr-1.5" /> Simpan
                        </button>
                        <button onClick=${() => setEditId(null)} className=${'inline-flex items-center h-[34px] px-3 rounded-[8px] bg-white border border-line text-muted text-[12px] font-medium hover:bg-page transition-colors duration-200 ' + FOCUS}>Batal</button>
                      </div>`
                      : html`<div className="text-[14px] font-semibold text-ink">${s.date ? new Date(s.date + 'T00:00:00').toLocaleDateString('ms-MY', { weekday:'short', day:'2-digit', month:'short', year:'numeric' }) : dt.toLocaleDateString('ms-MY', { weekday:'short', day:'2-digit', month:'short', year:'numeric' })} ${s.startTime ? html`<span className="text-muted font-normal">·</span> <span className="text-muted font-normal">${s.startTime}–${s.endTime}</span>` : html`<span className="text-muted font-normal">·</span> <span className="text-muted font-normal">${dt.toLocaleTimeString('ms-MY', { hour:'2-digit', minute:'2-digit' })}</span>`}</div>`}
                    <div className="text-[12px] text-muted mt-0.5">
                      ${pres} hadir · ${abs} tidak hadir ${s.archived ? html`<span className="ml-2 inline-flex items-center px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 text-[10px] font-semibold">ARKIB</span>` : html`<span className="ml-2 inline-flex items-center px-2 py-0.5 rounded-full bg-success/10 text-success text-[10px] font-semibold">AKTIF</span>`}
                    </div>
                  </div>
                  <div className="flex gap-1.5 shrink-0">
                    ${isActive ? html`<span className="inline-flex items-center h-[34px] px-3 rounded-[8px] bg-success/10 text-success text-[12px] font-semibold">✓ Set Aktif</span>`
                      : html`<button onClick=${() => onSetActive(s.id)} className=${'inline-flex items-center h-[34px] px-3 rounded-[8px] bg-primary text-white text-[12px] font-medium hover:bg-primary-dark transition-colors duration-200 ' + FOCUS}>▶ Set Aktif</button>`}
                    <button onClick=${() => startEdit(s)} title="Set masa sesi" className=${'inline-flex items-center justify-center h-[34px] w-[34px] rounded-[8px] bg-white border border-line text-muted hover:bg-page transition-colors duration-200 ' + FOCUS}>
                      <${IC.Clock} className="w-4 h-4" />
                    </button>
                    <button onClick=${() => onArchive(s.id)} title=${s.archived ? 'Buka arkib' : 'Arkib'} className=${'inline-flex items-center justify-center h-[34px] w-[34px] rounded-[8px] bg-white border border-line text-muted hover:bg-page transition-colors duration-200 ' + FOCUS}>
                      <${IC.Archive} className="w-4 h-4" />
                    </button>
                    <button onClick=${() => onDelete(s)} title="Padam sesi" className=${'inline-flex items-center justify-center h-[34px] w-[34px] rounded-[8px] bg-danger/10 border border-danger/20 text-danger hover:bg-danger/20 transition-colors duration-200 ' + FOCUS}>
                      <${IC.Trash2} className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              </div>`;
          }) : html`<div className="py-10 text-center text-[13px] text-muted">Belum ada sesi. Tekan "Sesi Baru" untuk mula.</div>`}
        </div>
      </div>
    </div>`;
}

function BuktiPage({}) {
  const [search, setSearch] = useState('');
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const cacheRef = useRef(null);

  const semak = async () => {
    const q = search.toLowerCase().trim();
    if (!q) { setResult(null); return; }
    setLoading(true);
    setResult(null);
    try {
      let rows = cacheRef.current;
      if (!rows) {
        const url = 'https://docs.google.com/spreadsheets/d/' + JDK_SHEET_ID + '/export?format=csv&gid=' + JDK_GID;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Gagal ambil data (HTTP ' + res.status + ')');
        rows = parseCSV(await res.text());
        cacheRef.current = rows;
      }
      if (!rows || rows.length < 2) { setResult({ err: 'Tiada data dalam spreadsheet JDK' }); setLoading(false); return; }
      const headers = rows[0].map(h => String(h).toLowerCase().trim());
      const findCol = kws => { for (const kw of kws) { const i = headers.findIndex(h => h.includes(kw)); if (i !== -1) return i; } return -1; };
      const colName = findCol(['nama','name']);
      const colId = findCol(['id pelajar','nombor id','student id','no. id','no id']);
      const colDate = findCol(['tarikh','date']);
      const filtered = rows.slice(1).filter(r => {
        const rn = String(r[colName >= 0 ? colName : 0] || '').toLowerCase();
        const ri = String(r[colId >= 0 ? colId : 0] || '').toLowerCase();
        return rn.includes(q) || ri.includes(q);
      });
      if (!filtered.length) { setResult({ empty: true, q }); setLoading(false); return; }
      const byStudent = {};
      filtered.forEach(r => {
        const name = colName >= 0 ? String(r[colName] || '').trim() : '—';
        const id = colId >= 0 ? String(r[colId] || '').trim() : '';
        const key = id || name;
        if (!byStudent[key]) byStudent[key] = { name, id, dates: [] };
        const d = colDate >= 0 ? String(r[colDate] || '').trim() : '';
        if (d) byStudent[key].dates.push(d);
      });
      setResult({ list: Object.values(byStudent) });
    } catch (e) {
      setResult({ err: e.message });
    }
    setLoading(false);
  };

  return html`
    <div className="flex flex-col h-full overflow-y-auto scroll-thin p-5 md:p-6 space-y-4">
      <div className="rounded-xl bg-white border border-line p-4 flex flex-col md:flex-row md:items-end gap-3">
        <div className="flex-1">
          <label className="block text-[12px] font-semibold text-ink mb-1.5">🔍 Cari Nama / ID Pelajar</label>
          <input value=${search} onChange=${e => setSearch(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter') semak(); }} placeholder="Nama atau ID..."
            className="w-full h-[44px] px-3.5 rounded-[10px] border border-line bg-white text-[14px] text-ink placeholder:text-muted/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/30" />
        </div>
        <button onClick=${semak} disabled=${loading}
          className=${'inline-flex items-center gap-2 h-[44px] px-5 rounded-[9px] bg-primary text-white text-[14px] font-medium hover:bg-primary-dark disabled:opacity-60 transition-colors duration-200 shadow-[0_6px_16px_-6px_rgba(37,99,235,0.55)] ' + FOCUS}>
          ${loading ? html`<${IC.RefreshCw} className="w-4 h-4 animate-spin" />` : html`<${IC.Search} className="w-4 h-4" />`}
          ${loading ? 'Mencari...' : 'Cari'}
        </button>
        <a href=${'https://docs.google.com/spreadsheets/d/' + JDK_SHEET_ID + '/edit?gid=' + JDK_GID} target="_blank" rel="noreferrer"
          className=${'inline-flex items-center gap-2 h-[44px] px-5 rounded-[9px] bg-white border border-line text-[14px] font-medium text-ink hover:bg-blue-hover transition-colors duration-200 ' + FOCUS}>
          <${IC.FileText} className="w-4 h-4 text-primary" /> Buka Spreadsheet JDK
        </a>
      </div>

      <div className="flex-1 min-h-0">
        ${!result && !loading ? html`<div className="flex items-center justify-center h-full text-[13px] text-muted">Taip nama pelajar untuk cari rekod MC / Surat.</div>` : null}
        ${loading ? html`<div className="flex items-center justify-center h-full text-[13px] text-muted">Memuatkan data...</div>` : null}
        ${result && result.err ? html`<div className="rounded-xl bg-danger/5 border border-danger/20 px-4 py-3 text-[13px] text-danger">Ralat: ${result.err}<br /><span className="text-[11px] text-muted">Pastikan spreadsheet JDK diset ke "Anyone with link can view".</span></div>` : null}
        ${result && result.empty ? html`<div className="rounded-xl bg-page border border-line px-4 py-3 text-[13px] text-muted">Tiada rekod dijumpai untuk <b>"${result.q}"</b></div>` : null}
        ${result && result.list ? html`
          <div className="space-y-3">
            <div className="text-[12px] font-medium text-muted">${result.list.length} pelajar dijumpai</div>
            ${result.list.map((s, i) => html`
              <div key=${i} className="rounded-xl bg-white border border-line p-4">
                <div className="text-[15px] font-semibold text-ink">${s.name}</div>
                ${s.id ? html`<div className="mt-0.5 text-[12px] text-muted font-mono">${s.id}</div>` : null}
                <div className="mt-3 text-[10px] font-semibold uppercase tracking-wide text-muted mb-2">Tarikh Tidak Hadir</div>
                ${s.dates.length ? html`<div className="flex flex-wrap gap-2">${s.dates.map((d, j) => html`<span key=${j} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-danger/5 border border-danger/20 text-[12px] font-mono text-ink"><span className="w-1.5 h-1.5 rounded-full bg-danger"></span>${d}</span>`)}</div>` : html`<div className="text-[12px] text-muted">Tiada tarikh tidak hadir direkod</div>`}
              </div>`)}
          </div>` : null}
      </div>
    </div>`;
}
function parseCSV(text){
  const rows = []; let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i+1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += ch;
    }
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

function RekodSheetRecords({ labels }) {
  const [sessions, setSessions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState(null);
  const [last, setLast] = useState(null);
  const [open, setOpen] = useState({});
  const timerRef = useRef(null);

  const load = useCallback(async () => {
    const url = getRekodUrl();
    const m = String(url || '').match(/\/d\/([-\w]+)/);
    if (!m) { setErr('URL sheet REKOD belum diset di Tetapan.'); setLoading(false); return; }
    const gid = getRekodGid();
    const matchLabels = (labels || []).map(normKlas).filter(Boolean);
    try {
      const res = await fetch('https://docs.google.com/spreadsheets/d/' + m[1] + '/export?format=csv&gid=' + gid);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      let all = groupSheetRows(await res.text());
      if (matchLabels.length) {
        all = all.filter(s => { const k = normKlas(s.cls || ''); return !!k && matchLabels.some(l => k === l || k.includes(l)); });
      } else {
        all = [];
      }
      setSessions(all);
      setLast(new Date());
      setErr(null);
    } catch (e) {
      setErr(e.message);
    }
    setLoading(false);
  }, [labels]);

  useEffect(() => {
    load();
    timerRef.current = setInterval(load, 30000);
    return () => { clearInterval(timerRef.current); };
  }, [load]);

  return html`
    <div className="space-y-3">
      <div className="flex items-center gap-2 flex-wrap">
        <${IC.RefreshCw} className=${'w-4 h-4 text-primary ' + (loading ? 'animate-spin' : '')} />
        <span className="text-[12px] font-semibold text-muted">Rekod dari Sheet · auto-muat setiap 30 saat${last ? ' · dikemas kini ' + fmtClock(last) : ''}</span>
        <a href=${getRekodUrl()} target="_blank" rel="noreferrer" className="ml-auto inline-flex items-center gap-1.5 text-[12px] font-medium text-primary hover:underline">
          <${IC.FileText} className="w-3.5 h-3.5" /> Buka Sheet
        </a>
      </div>
      ${err ? html`<div className="rounded-xl bg-danger/5 border border-danger/20 px-4 py-3 text-[12.5px] text-danger leading-relaxed">Gagal muat sheet: ${err}<br /><span className="text-[11px] text-muted">Pastikan spreadsheet REKOD KEHADIRAN diset "Anyone with the link can view".</span></div>` : null}
      ${sessions.length ? sessions.map((s, i) => {
        const pres = s.rows.filter(r => String(r.status).toUpperCase() === 'HADIR').length;
        const abs = s.rows.filter(r => String(r.status).toUpperCase() !== 'HADIR').length;
        const k = s.date + s.cls;
        const isOpen = !!open[k];
        return html`
          <div key=${i} className="rounded-xl bg-white border border-line overflow-hidden">
            <button onClick=${() => setOpen(o => ({ ...o, [k]: !o[k] }))} className=${'w-full px-4 py-3 flex items-center gap-3 text-left transition-colors ' + FOCUS + (isOpen ? ' bg-blue-hover/60' : ' hover:bg-blue-hover/40')}>
              <div className="min-w-0 flex-1">
                <div className="text-[14px] font-semibold text-ink truncate">${s.cls || '—'}</div>
                <div className="text-[12px] text-muted mt-0.5">${s.date} · ${s.rows.length} pelajar · <span className="text-success font-medium">${pres} hadir</span> · <span className="text-danger font-medium">${abs} tidak hadir</span></div>
              </div>
              <${IC.ChevronDown} className=${'w-4 h-4 text-muted shrink-0 transition-transform duration-200 ' + (isOpen ? 'rotate-180' : '')} />
            </button>
            ${isOpen ? html`
              <div className="border-t border-line overflow-x-auto">
                <table className="w-full text-[12px]">
                  <thead className="bg-page/80">
                    <tr>
                      <th className="px-4 py-2 text-left font-semibold text-muted text-[10px] uppercase tracking-wide">No. ID</th>
                      <th className="px-4 py-2 text-left font-semibold text-muted text-[10px] uppercase tracking-wide">Nama</th>
                      <th className="px-4 py-2 text-left font-semibold text-muted text-[10px] uppercase tracking-wide">Status</th>
                      <th className="px-4 py-2 text-right font-semibold text-muted text-[10px] uppercase tracking-wide">Masa</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${s.rows.map((r, j) => html`
                      <tr key=${j} className="border-t border-line/60">
                        <td className="px-4 py-1.5 font-mono text-[11px] text-muted">${r.id || '—'}</td>
                        <td className="px-4 py-1.5 font-medium text-ink">${r.name || '—'}</td>
                        <td className="px-4 py-1.5"><span className=${'inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold ' + (String(r.status).toUpperCase() === 'HADIR' ? 'bg-success/10 text-success' : 'bg-danger/10 text-danger')}>${r.status || '—'}</span></td>
                        <td className="px-4 py-1.5 text-right font-mono text-[11px] text-muted">${r.time || '—'}</td>
                      </tr>`)}
                  </tbody>
                </table>
              </div>` : null}
          </div>`;
      }) : (loading ? html`<div className="rounded-xl bg-page border border-line px-4 py-6 text-center text-[12.5px] text-muted">Memuat rekod dari sheet…</div>` : html`<div className="rounded-xl bg-page border border-line px-4 py-6 text-center text-[12.5px] text-muted">Tiada rekod dalam sheet REKOD KEHADIRAN untuk kelas pensyarah ini.</div>`)}
    </div>`;
}

function groupSheetRows(text) {
  const rows = parseCSV(text).slice(1).filter(r => r.some(c => String(c).trim() !== ''));
  const byKey = {};
  rows.forEach(r => {
    const date = String(r[0] || '').trim();
    const cls = String(r[1] || '').trim();
    if (!date && !cls) return;
    const key = date + '|' + cls;
    if (!byKey[key]) byKey[key] = { date, cls, rows: [] };
    byKey[key].rows.push({ id: String(r[2]||'').trim(), name: String(r[3]||'').trim(), status: String(r[4]||'').trim(), time: String(r[5]||'').trim() });
  });
  return Object.values(byKey).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
}

function exportPDF({ className, lecturer, date, tS, tE, dur, sesiLabel, rows, pres, abs, pct }) {
  if (!window.jspdf) return 'Library PDF belum siap. Cuba semula sebentar lagi.';
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const df = new Date(date + 'T00:00:00').toLocaleDateString('ms-MY', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
    doc.setFontSize(17); doc.setFont('helvetica','bold'); doc.text('REKOD KEHADIRAN PELAJAR', 105, 16, { align:'center' });
    doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.setTextColor(100); doc.text('ATTEND.SYS — Sistem Kehadiran Digital', 105, 22, { align:'center' });
    doc.setTextColor(0); doc.setFontSize(10);
    const info = [
      ['Subjek', className],
      ['Sesi', sesiLabel],
      ['Pensyarah', lecturer],
      ['Tarikh', df],
      ['Masa Kelas', tS + ' — ' + tE + ' (' + dur + ')'],
      ['Statistik', 'Jumlah: ' + rows.length + ' | Hadir: ' + pres + ' | Tidak Hadir: ' + abs + ' | Peratus: ' + pct + '%']
    ];
    let y = 30;
    info.forEach(([l, v]) => { doc.setFont('helvetica','bold'); doc.text(l + ':', 14, y); doc.setFont('helvetica','normal'); doc.text(String(v), 50, y); y += 6; });
    doc.autoTable({
      startY: y + 4,
      head: [['#', 'No. ID', 'Nama Pelajar', 'Status', 'Masa']],
      body: rows.map((r, i) => [i + 1, r.id, r.name, r.status === 'present' ? 'Hadir' : r.status === 'absent' ? 'Tidak Hadir' : '—', r.time || '—']),
      styles: { fontSize: 8, cellPadding: 3 },
      headStyles: { fillColor: [20, 23, 32], textColor: 255, fontSize: 8, fontStyle: 'bold' },
      alternateRowStyles: { fillColor: [240, 244, 255] },
      columnStyles: { 0: { cellWidth: 8 }, 1: { cellWidth: 28 }, 2: { cellWidth: 80 }, 3: { cellWidth: 24 }, 4: { cellWidth: 18 } },
      didParseCell: function (data) {
        if (data.section === 'body' && data.column.index === 3) {
          if (data.cell.raw === 'Hadir') data.cell.styles.textColor = [0, 160, 90];
          else if (data.cell.raw === 'Tidak Hadir') data.cell.styles.textColor = [200, 40, 40];
        }
      }
    });
    const pages = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pages; i++) {
      doc.setPage(i); doc.setFontSize(8); doc.setTextColor(150);
      doc.text('ATTEND.SYS — Dicetak: ' + new Date().toLocaleString('ms-MY'), 14, doc.internal.pageSize.height - 8);
      doc.text(i + '/' + pages, doc.internal.pageSize.width - 14, doc.internal.pageSize.height - 8, { align:'right' });
    }
    doc.save('kehadiran-' + slug(className) + '-' + date + '.pdf');
    return null;
  } catch (e) {
    return 'Gagal jana PDF: ' + e.message;
  }
}

const GAS_CODE = `/**
 * SISTEM CLASS ATTENDANCE - Google Apps Script Backend
 * Deploy sebagai WEB APP: Extensions > Apps Script > paste kod ni
 *   Deploy > New deployment > Type: Web app
 *   Execute as: Me | Who has access: Anyone
 * Struktur sheet: "Students" (respons Google Form), "Attendance" (rekod)
 */
const SHEET_STUDENTS = 'Students';
const SHEET_ATTENDANCE = 'Attendance';

function doGet(e) {
  e = e || { parameter: {} };
  const action = e.parameter.action;
  try {
    if (action === 'getStudents') return respond(getStudents());
    if (action === 'getLastRow') return respond(getLastRow(e.parameter));
    if (action === 'getAttendance') return respond(getAttendanceHistory(e.parameter.sessionId));
    if (action === 'savebulk') return respond(saveBulk(e.parameter));
    if (action === 'updatebulk') return respond(updateBulk(e.parameter));
    if (action === 'photo') return respond(getPhoto(e.parameter));
    return respond({ error: 'Unknown action: ' + action });
  } catch (err) { return respond({ error: err.message }); }
}
function doPost(e) {
  try {
    e = e || { postData: { contents: '{}' } };
    const body = JSON.parse(e.postData.contents || '{}');
    const action = body.action;
    if (action === 'recordAttendance') return respond(recordAttendance(body));
    if (action === 'addStudent') return respond(addStudentManually(body));
    return respond({ error: 'Unknown action' });
  } catch (err) { return respond({ error: err.message }); }
}
function respond(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}
function getStudents() {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(SHEET_STUDENTS);
  if (!sheet) return [];
  const data = sheet.getDataRange().getValues();
  const headers = data.shift();
  return data.map(row => { const obj = {}; headers.forEach((h, i) => obj[h] = row[i]); return obj; });
}
function addStudentManually(body) {
  const sheet = getOrCreateSheet(SHEET_STUDENTS, ['Timestamp', 'ID', 'Nama']);
  sheet.appendRow([new Date(), body.studentId, body.name]);
  return { success: true };
}
function recordAttendance(body) {
  const sheet = getOrCreateSheet(SHEET_ATTENDANCE, ['Timestamp', 'SessionId', 'ClassName', 'StudentId', 'StudentName', 'Date']);
  sheet.appendRow([new Date(), body.sessionId, body.className, body.studentId, body.studentName, body.date]);
  return { success: true };
}
function saveBulk(p) {
  try {
    const records = JSON.parse(p.records || '[]');
    if (!records.length) return { success: true, saved: 0 };
    let ss, sh;
    if (p.sheet) {
      ss = SpreadsheetApp.openByUrl(p.sheet); sh = null;
      if (p.gid) { const gs = ss.getSheets(); for (let i=0;i<gs.length;i++){ if (String(gs[i].getSheetId()) === String(p.gid)) { sh = gs[i]; break; } } }
      if (!sh) sh = ss.getSheets()[0];
    } else {
      ss = SpreadsheetApp.getActiveSpreadsheet();
      sh = ss.getSheetByName('REKOD KEHADIRAN');
      if (!sh) { sh = ss.insertSheet('REKOD KEHADIRAN'); }
    }
    const header = ['TARIKH','KEHADIRAN KELAS','NO ID','NAMA','STATUS','MASA','PENSYARAH'];
    const rows = records.map(function (r) { return [r.date, r.class, r.id, r.name, r.status, r.time, r.lecturer_name || r.pensyarah || '']; });
    if (sh.getLastRow() === 0) {
      sh.getRange(1, 1, rows.length + 1, 7).setValues([header].concat(rows));
    } else {
      const startRow = p.row ? Number(p.row) : sh.getLastRow() + 1;
      sh.getRange(startRow, 1, rows.length, 7).setValues(rows);
    }
    if (String(p.last || '') === '1') sh.appendRow(['','','','','','','']);
    return { success: true, saved: records.length };
  } catch (err) { return { success: false, error: String(err) }; }
}
function getLastRow(p) {
  try {
    let sh;
    if (p.sheet) {
      const ss = SpreadsheetApp.openByUrl(p.sheet);
      sh = null;
      if (p.gid) { const gs = ss.getSheets(); for (let i=0;i<gs.length;i++){ if (String(gs[i].getSheetId()) === String(p.gid)) { sh = gs[i]; break; } } }
      if (!sh) sh = ss.getSheets()[0];
    } else {
      sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('REKOD KEHADIRAN');
      if (!sh) sh = SpreadsheetApp.getActiveSpreadsheet().getSheets()[0];
    }
    return { success: true, lastRow: sh.getLastRow() };
  } catch (err) { return { success: false, error: String(err) }; }
}
function updateBulk(p) {
  try {
    const updates = JSON.parse(p.updates || '[]');
    if (!updates.length) return { success: true, updated: 0 };
    let ss, sh;
    if (p.sheet) {
      ss = SpreadsheetApp.openByUrl(p.sheet); sh = null;
      if (p.gid) { const gs = ss.getSheets(); for (let i=0;i<gs.length;i++){ if (String(gs[i].getSheetId()) === String(p.gid)) { sh = gs[i]; break; } } }
      if (!sh) sh = ss.getSheets()[0];
    } else {
      ss = SpreadsheetApp.getActiveSpreadsheet();
      sh = ss.getSheetByName('REKOD KEHADIRAN');
      if (!sh) { sh = ss.insertSheet('REKOD KEHADIRAN'); sh.appendRow(['TARIKH','KEHADIRAN KELAS','NO ID','NAMA','STATUS','MASA','PENSYARAH']); }
    }
    if (!sh || sh.getLastRow() < 2) return { success: true, updated: 0 };
    const data = sh.getDataRange().getValues();
    const byKey = {};
    for (let i = 0; i < data.length; i++) {
      const key = String(data[i][0] || '') + '|' + String(data[i][1] || '') + '|' + String(data[i][2] || '');
      if (!byKey[key]) byKey[key] = [];
      byKey[key].push(i + 1);
    }
    let updated = 0;
    updates.forEach(function (u) {
      const key = String(u.date || '') + '|' + String(u.class || '') + '|' + String(u.id || '');
      const rows = byKey[key] || [];
      rows.forEach(function (r) {
        sh.getRange(r, 5, 1, 2).setValues([[u.status, u.time || '']]);
        updated++;
      });
    });
    return { success: true, updated: updated };
  } catch (err) { return { success: false, error: String(err) }; }
}
function getPhoto(p) {
  const fileId = p && p.fileId ? String(p.fileId).trim() : '';
  if (!fileId) return { success: false, error: 'No fileId' };
  try {
    const f = DriveApp.getFileById(fileId);
    return { success: true, photo: 'data:image/jpeg;base64,' + Utilities.base64Encode(f.getBlob().getBytes()) };
  } catch (err) { return { success: false, error: String(err) }; }
}
function getAttendanceHistory(sessionId) {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(SHEET_ATTENDANCE);
  if (!sheet) return [];
  const data = sheet.getDataRange().getValues();
  const headers = data.shift();
  let rows = data.map(row => { const obj = {}; headers.forEach((h, i) => obj[h] = row[i]); return obj; });
  if (sessionId) rows = rows.filter(r => r.SessionId === sessionId);
  return rows;
}
function getOrCreateSheet(name, headerRow) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sheet = ss.getSheetByName(name);
  if (!sheet) { sheet = ss.insertSheet(name); sheet.appendRow(headerRow); }
  return sheet;
}`;

      return;
    }

    const name = LECTURER_MAP[no];

      setError('No. Gaji tidak berdaftar.');
      return;

    setBusy(true);

    const lecturer = {
      noGaji: no,

    try {
      await qr.start(
        { facingMode: 'environment' },
        { fps: 8, qrbox: 240 },
        text => {
          const now = Date.now();
          const prev = lastDecodeRef.current;
          if (prev.text === text && now - prev.t < 1500) return;
          lastDecodeRef.current = { text, t: now };
          try { if (qr.getState() === 2) qr.pause(); } catch (e) {}
          const fn = scanHandlerRef.current;
          if (fn) fn(text).catch(() => {}).finally(() => setTimeout(() => {
            try { if (qr.getState() === 3) qr.resume(); } catch (e) {}
          }, 350));
        },
        () => {}
      );
    } catch (err) {

      setScanStatus('Gagal buka kamera: ' + err);

    if (!url.startsWith('PASTE') && records.length) {

      for (let i = 0; i < records.length; i += chunkSize) chunks.push(records.slice(i, i + chunkSize));
      const sendChunk = (chunk, isLast, row) => {
        const q = '?action=savebulk&records=' + encodeURIComponent(JSON.stringify(chunk)) + '&sesi=' + encodeURIComponent(classLabel(cls)) + '&gaji=' + encodeURIComponent(lectNoGaji) + '&pensyarah=' + encodeURIComponent(lectName) + '&sheet=' + encodeURIComponent(getRekodUrl()) + '&gid=' + encodeURIComponent(getRekodGid()) + '&last=' + (isLast ? '1' : '0') + (row ? '&row=' + row : '');

      if (chunks.length <= 1) {
        const d = await sendChunk(chunks[0], true, 0);

${subjekLine}*Kelas:* ${kelas}

*TIDAK HADIR* ke kelas pada:
*Tarikh:* ${df}
*Masa Kelas:* ${m.tS} — ${m.tE} (${durBadge(m.tS, m.tE)})

Mohon bantuan untuk ingatkan dia supaya hantar bukti alasan tidak hadir (MC / surat berkaitan) kepada JDK dalam tempoh *3 hari bekerja* selepas tarikh dia tak hadir hari ni:

Terima kasih.
${pensyarah}, Pensyarah Subjek${subjek ? ' ' + subjek : ''}`;
    setAbsentModal(null);
    setWaModal({ type: 'mentor', title: 'Notifikasi kepada Mentor', phone: m.student.mentorPhone || '', msg, accent: 'bg-wa' });
  };

  const openWAStudent = () => {
    const m = absentModal;
    if (!m) return;
    const date = m.date;
    const df = new Date(date + 'T00:00:00').toLocaleDateString('ms-MY', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    const nick = m.student.nickname || m.student.name.split(' ')[0];
    const subjekWA = (m.student && m.student.subjek) || ((m.cls && m.cls.subjName) || '') || classLabel(m.cls);
    const msg = `Assalamualaikum ${nick},

Anda *TIDAK HADIR* ke kelas pada:
📅 *${df}*
⏰ *${m.tS} — ${m.tE}*
📚 *${subjekWA}*

Sila hantar bukti ketidakhadiran (MC/surat) kepada JDK dalam tempoh *3 hari bekerja*.

Terima kasih.`;
    setAbsentModal(null);
    setWaModal({ type: 'student', title: 'Notifikasi kepada Pelajar', phone: m.student.phone || '', msg, accent: 'bg-primary' });
  };

  const sendWA = () => {
    if (!waModal) return;
    const ph = waModal.phone.replace(/\D/g, '');
    if (!ph) { toast('Masukkan no. telefon', 'err'); return; }
    window.open('https://wa.me/' + ph + '?text=' + encodeURIComponent(waModal.msg), '_blank');
    setWaModal(null);
    toast('WhatsApp dibuka!', 'ok');
  };

  const modalStudent = studentModal;
  const modalStudentAtt = sessionId && modalStudent ? (attMap[sessionId] || {})[studentIdOf(modalStudent)] : null;

  return html`
    <div className="min-h-screen bg-page text-ink font-sans lg:pl-60">
      <${Sidebar} active=${nav} onSelect=${setNav} open=${sidebarOpen} onClose=${() => setSidebarOpen(false)} lecturer=${currentLecturer} onLogout=${handleLogout} />
      <div className="flex flex-col min-h-screen">
        <div className="shrink-0 px-4 md:px-7 lg:px-[42px] pt-[30px]">
          <${Header} now=${now} title=${NAV_TITLE[nav]} onMenu=${() => setSidebarOpen(true)} />
        </div>
        <main className="flex-1 flex flex-col gap-4 lg:gap-[18px] px-4 md:px-7 lg:px-[42px] pt-[22px] pb-2">
          ${showWarning ? html`<${WarningCard} msg="Firebase belum dikonfigurasi. Tetapkan konfigurasi Firebase di menu Tetapan atau di bahagian CONFIG fail index.html sebelum guna sistem ini." />` : null}
          <div className="h-[74px] shrink-0 bg-white border border-line rounded-[14px] shadow-sm px-3.5 md:px-4 flex items-center gap-3 md:gap-4 w-full">
            <button onClick=${() => setAddClassOpen(true)}
              className=${'inline-flex items-center justify-center gap-2 h-[46px] px-5 rounded-[9px] bg-primary text-white text-[14px] font-medium hover:bg-primary-dark transition-colors duration-200 shadow-[0_6px_16px_-6px_rgba(37,99,235,0.55)] ' + FOCUS}>
              <${IC.Plus} className="w-[17px] h-[17px]" />
              <span>Tambah Kelas</span>
            </button>
            <button onClick=${onRefresh} aria-label="Muat semula data"
              className=${'inline-flex items-center justify-center gap-2 h-[46px] px-5 rounded-[9px] bg-white border border-line text-[14px] font-medium text-ink hover:bg-blue-hover transition-colors duration-200 ' + FOCUS}>
              <${IC.RefreshCw} className=${'w-[17px] h-[17px] text-primary' + (refreshing ? ' animate-spin' : '')} />
              <span className="hidden sm:inline">Refresh</span>
            </button>
          </div>
          <div className="min-h-[420px] bg-white border border-line rounded-2xl md:rounded-[20px] shadow-[0_10px_30px_rgba(15,23,42,0.06)] flex flex-col">
            ${card}
          </div>
          <footer className="shrink-0 text-center text-[12px] md:text-[14px] text-foot py-5 md:py-[22px]">© 2026 KPMIM. Semua hak cipta terpelihara.</footer>
        </main>
      </div>

      ${addClassOpen ? html`<${AddClassModal} initial=${dupClass} onClose=${() => { setAddClassOpen(false); setDupClass(null); }} onSave=${handleSaveClass} />` : null}
      ${editClass ? html`<${EditClassModal} cls=${editClass} onClose=${() => setEditClass(null)} onSave=${saveClass} onDelete=${() => setConfirm({ title: 'Padam Kelas?', msg: 'Kelas, semua sesi dan rekod kehadirannya akan dipadam. Tindakan ini tidak boleh dibatalkan. Teruskan?', yesLabel: 'Ya, Padam', onYes: deleteClass })} />` : null}
      ${addStudentOpen ? html`<${AddStudentModal} classes=${classes} activeClassId=${activeClassId} allStudents=${students} onClose=${() => setAddStudentOpen(false)} onSave=${handleSaveStudent} />` : null}
      ${modalStudent ? html`<${StudentModal} student=${modalStudent} att=${modalStudentAtt} photos=${photos} rot=${rots[modalStudent.id] || 0} onRotate=${rotatePhoto} onReplace=${replacePhoto} onDelete=${deletePhoto} onZoom=${src => { setZoomSrc(src); setZoomStudentId(modalStudent.id); }} onClose=${() => setStudentModal(null)} />` : null}
      ${zoomSrc ? html`<${ZoomOverlay} src=${zoomSrc} rot=${zoomStudentId ? (rots[zoomStudentId] || 0) : 0} onRotate=${d => { if (zoomStudentId) rotatePhoto(zoomStudentId, d); }} onClose=${() => { setZoomSrc(null); setZoomStudentId(null); }} />` : null}
      ${absentModal ? html`<${AbsentChoiceModal} student=${absentModal.student} cls=${absentModal.cls || { className: '' }} date=${absentModal.date} tS=${absentModal.tS} tE=${absentModal.tE} dur=${durBadge(absentModal.tS, absentModal.tE)} onMentor=${openWAMentor} onStudent=${openWAStudent} onClose=${() => setAbsentModal(null)} />` : null}
      ${waModal ? html`<${WAModal} title=${waModal.title} phone=${waModal.phone} msg=${waModal.msg} accent=${waModal.accent} onChangePhone=${ph => setWaModal(m => ({ ...m, phone: ph }))} onSend=${sendWA} onClose=${() => setWaModal(null)} />` : null}
      ${saveModal ? html`<${SaveSessionModal} info=${saveModal} onConfirm=${confirmSaveSession} onClose=${() => setSaveModal(null)} saving=${saving} />` : null}
      ${sesiMgrOpen ? html`<${SesiManager} sessions=${sessionsMap[activeClassId] || []} activeSessionId=${sessionId} attMap=${attMap} onSetActive=${setActiveSesi} onArchive=${toggleArchive} onDelete=${s => setConfirm({ title: 'Padam Sesi?', msg: 'Sesi ini dan semua rekod kehadirannya akan dipadam. Tindakan ini tidak boleh dibatalkan. Teruskan?', yesLabel: 'Ya, Padam', onYes: () => deleteSesi(s) })} onNew=${openNewSessionModal} onClose=${() => setSesiMgrOpen(false)} onSetTime=${setSessionTime} />` : null}
      ${newSeshOpen && newSeshDraft ? html`<${NewSessionModal} draft=${newSeshDraft} onClose=${() => setNewSeshOpen(false)} onCreate=${onNewSession} />` : null}
      ${confirm ? html`<${ConfirmModal} title=${confirm.title} msg=${confirm.msg} yesLabel=${confirm.yesLabel} onYes=${() => { const f = confirm.onYes; setConfirm(null); f && f(); }} onClose=${() => setConfirm(null)} />` : null}

      ${scannerOpen ? html`<${ScannerModal} status=${scanStatus} log=${scanLog} onManualId=${async id => { if (!id) return; const st = getStudentById(id.trim()); if (!st) { setScanStatus('ID tidak dijumpai: ' + id); addScanLog(null, false); document.getElementById('manual-id').value = ''; return; } const r = await markRef.current(st.id, 'present'); if (r && r.ok) { setScanStatus('✓ ' + (st.nickname || studentNameOf(st).split(' ')[0]) + ' ditanda hadir'); addScanLog(st, true); setStampKey(k => k + 1); setStampOn(true); clearTimeout(stampTimer.current); stampTimer.current = setTimeout(() => setStampOn(false), 1100); } else { setScanStatus('Gagal: ' + ((r && r.msg) || 'ralat')); addScanLog(null, false); } document.getElementById('manual-id').value = ''; }} onScanImage=${handleScanImage} onClose=${() => setScannerOpen(false)} />` : null}

      ${stampOn ? html`<div key=${stampKey} className="stamp">HADIR ✓</div>` : null}
      <${Toast} msg=${toastMsg} type=${toastType} />
    </div>`;
}

const root = createRoot(document.getElementById('root'));
root.render(html`<${App} />`);
</script>
</body>
</html>
