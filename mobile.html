const MONTHS = ['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];

const fmtClock = d => {
  let h = d.getHours(), m = d.getMinutes();

const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
const nowHHMM = () => { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const addHours = (t, h) => {
  const [hh, mm] = String(t).split(':').map(Number);
  if ([hh, mm].some(isNaN)) return t;
  const d = new Date(2020, 0, 1, hh, mm);
  d.setMinutes(d.getMinutes() + Math.round((h || 0) * 60));
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
};

const DEC_SUBJECT_MAP = {
  'DEC1A': 'FLG 1202 - Mandarin 1',
  'DEC1D': 'ITE 1133 - Introduction of Information Technology Applications and Multimedia'
};
const decSubjectFor = (o) => {
  const src = String((o && o.source_name) || '').trim().toUpperCase();
  if (!src.includes('FAYYADH')) return '';
  const k = String((o && o.registered_class) || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  return DEC_SUBJECT_MAP[k] || '';
};

function normalizeStudent(o) {
  if (!o || typeof o !== 'object') return null;
  const id = String(o.no_matrik || '').trim();
  const name = String(o.nama || '').trim().toUpperCase();
  if (!id || !name) return null;
  return {
    id, name,
    source_name: String(o.source_name || '').trim().toUpperCase(),
    nickname: String(o.nama_panggilan || '').trim(),
    phone: cleanPhone(o.no_telefon || ''),
    mentor: String(o.mentor || '').trim(),
    mentorPhone: cleanPhone(o.no_mentor || o.no_wa_mentor || ''),
    guardian: String(o.nama_penjaga || '').trim(),
    guardianPhone: cleanPhone(o.no_telefon_penjaga || ''),
    resident: String(o.status_kediaman || '').toLowerCase().includes('non') ? 'non-resident' : 'resident',
    kelas: String(o.registered_class || '').trim().toUpperCase(),
    subjek: decSubjectFor(o),
    sesiId: String(o.semester || '').trim(),
    photoFileId: extractDriveId(o.gambar_pelajar || o.image_url_1 || ''),
    local: false,
    supabaseId: o.id || '',
    classId: o.class_id || '',
    semester: o.semester || '',
    program: o.program || ''
  };
}

const subjCodeOf = (c) => {
  const sn = String((c && c.subjName) || '').trim();
  if (!sn) return '';
  const i = sn.indexOf(' - ');
  return i > 0 ? sn.slice(0, i).trim() : '';
};
const classLabel = (c) => {
  if (!c) return '';
  const code = (c.code || '').trim();
  const name = (c.className || '').trim();
  const display = subjCodeOf(c) || code;
  if (display && name) return display + ' ' + name;
  return name || display || (c.className || '');
};
const normKlas = (v) => String(v || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
const groupOf = (cls) => {
  const code = normKlas(cls.code);
  const toks = String(cls.className || '').toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);
  const kept = toks.filter(t => !(code && code.includes(t)));
  return kept.join('');
};
const stuInClass = (cls, s) => {
  if (!cls || !s) return true;
  const k = normKlas(s.kelas);
  if (!k) return false;
  const code = normKlas(cls.code);
  const name = normKlas(cls.className);
  const label = normKlas(classLabel(cls));
  const prog = (code || '').replace(/\d+/g, '');
  if (name && k.includes(name)) return true;
  if (label && k.includes(label)) return true;
  const group = groupOf(cls);
  if (group && k.includes(group)) {
    if (!prog || k.includes(prog)) return true;
  }
  if (code && k.includes(code)) {
    const rem = k.replace(code, '');
    if (!rem) return true;
    return group ? (rem.includes(group) || k.includes(name)) : true;
  }
  if (k.length >= 2 && name.includes(k)) return true;
  return false;
};
const attOwnedByLecturer = (v, lecturer) => {
  if (!v || !lecturer) return false;
  const gaji = String(lecturer.noGaji || '').trim();
  if (!gaji) return false;
  return String(v.lecturer_no_gaji || '').trim() === gaji;
};

function LecturerLogin({ onLogin }) {
  const [noGaji, setNoGaji] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = () => {
    const no = noGaji.trim();
    setError('');
    if (!/^\d{6}$/.test(no)) { setError('Sila masukkan No. Gaji 6 digit.'); return; }
    const name = LECTURER_MAP[no];
    if (!name) { setError('No. Gaji tidak berdaftar.'); return; }
    setBusy(true);
    const lecturer = { noGaji: no, name };
    saveCurrentLecturer(lecturer);
    setTimeout(() => { onLogin(lecturer); setBusy(false); }, 300);
  };

  return html`
    <div className="min-h-screen bg-navy flex flex-col items-center justify-center px-6 py-10" style=${{background:'linear-gradient(160deg,#12284F 0%,#0F2344 55%,#1D4ED8 130%)'}}>

      </div>
      <h1 className="text-white text-2xl font-extrabold tracking-tight">ATTEND.SYS</h1>
      <p className="text-blue-200/60 text-[13px] mt-1 mb-8">Sistem Kehadiran Digital KPMIM</p>
      <div className="w-full max-w-[340px] bg-white rounded-2xl shadow-2xl p-6">
        <h2 className="text-[15px] font-bold text-navy">Log Masuk Pensyarah</h2>
        <p className="text-[12px] text-muted mt-0.5 mb-4">Masukkan No. Gaji untuk meneruskan.</p>
        <label className="block text-[12px] font-semibold text-ink mb-1.5">No. Gaji</label>
        <input
          type="text" inputMode="numeric" maxLength="6" autoComplete="off"
          value=${noGaji}
          onInput=${e => {
            e.target.value = e.target.value.replace(/\D/g,'').slice(0,6);
            setNoGaji(e.target.value); setError('');
          }}
          onKeyDown=${e => { if (e.key === 'Enter') submit(); }}
          placeholder="— — — — — —"
          className=${'w-full h-[50px] px-4 rounded-xl border border-line bg-white text-center text-[18px] text-ink font-mono tracking-[0.35em] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 ' + (error ? 'border-danger' : '')}
        />
        ${error ? html`<p className="mt-2 text-[12px] font-medium text-danger">${error}</p>` : null}
        <button onClick=${submit} disabled=${busy}
          className="mt-4 w-full h-[50px] rounded-xl bg-primary text-white text-[15px] font-semibold hover:bg-primary-dark disabled:opacity-60 transition-colors no-tap">
          ${busy ? 'Memproses…' : 'Masuk'}
        </button>
        <p className="mt-4 text-center text-[10px] text-muted">KPMIM · Sistem Kehadiran Digital</p>
      </div>
    </div>`;
}

function App() {
  const [currentLecturer, setCurrentLecturer] = useState(getCurrentLecturer());
  const [classes, setClasses] = useState([]);
  const [students, setStudents] = useState([]);
  const [activeClassId, setActiveClassId] = useState(null);
  const [sessionsMap, setSessionsMap] = useState({});
  const [selSessionMap, setSelSessionMap] = useState({});
  const [attMap, setAttMap] = useState({});
  const [scannerOpen, setScannerOpen] = useState(false);
  const [scanStatus, setScanStatus] = useState('');
  const [loaded, setLoaded] = useState(false);
  const [toastMsg, setToastMsg] = useState(null);
  const [stampKey, setStampKey] = useState(0);
  const [stampOn, setStampOn] = useState(false);
  const [live, setLive] = useState(false);

  const qrCodeRef = useRef(null);
  const stampTimer = useRef(null);
  const toastTimer = useRef(null);
  const lecturerRef = useRef(currentLecturer);
  const studentFilterRef = useRef([]);
  const scanHandlerRef = useRef(null);
  const lastDecodeRef = useRef({ text: '', t: 0 });
  const beepCtxRef = useRef(null);
  const beepUnlockedRef = useRef(false);

  const toast = (msg, type) => {
    setToastMsg(msg); clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastMsg(null), 2500);
  };

  useEffect(() => { lecturerRef.current = currentLecturer; }, [currentLecturer]);
  useEffect(() => { studentFilterRef.current = students; }, [students]);

  const filterClassesForLecturer = useCallback((arr) => {
    const lect = lecturerRef.current;
    const sts = studentFilterRef.current || [];
    if (!lect || !lect.name) return [];
    const lname = String(lect.name).trim().toUpperCase();
    return (arr || []).filter(cls => {
      if (sts.some(s => stuInClass(cls, s))) return true;
      const cl = String(cls.lecturer || '').trim().toUpperCase();
      return !!cl && cl === lname;
    });
  }, []);

  const loadClasses = useCallback(async () => {
    try {
      const snap = await withTimeout(getDocs(collection(db, 'classes')), 15000, 'Muat kelas');
      const arr = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      const filtered = filterClassesForLecturer(arr);
      setClasses(filtered);
      if (filtered.length) setActiveClassId(cur => (cur && filtered.find(c => c.id === cur) ? cur : filtered[0].id));
      else setActiveClassId(null);
    } catch (e) { console.error('Gagal load classes', e); }
  }, [filterClassesForLecturer]);

  const autoCreateClasses = useCallback(async (students, lecturerName) => {
    try {
      const names = [...new Set((students || []).map(s => (s.kelas || '').trim()).filter(Boolean))];
      if (!names.length) return;
      const snap = await getDocs(collection(db, 'classes'));
      const existing = new Set(snap.docs.map(d => d.id));
      const existingNames = new Set(snap.docs.map(d => normKlas(d.data().className || '')));
      let created = 0;
      for (const n of names) {
        const parts = n.split(/[-–—]|\s+/).map(x => x.trim()).filter(Boolean);
        const first = (parts[0] || '').toUpperCase();
        let code = '';
        if (/^[A-Z]{2,4}\d{3,4}$/.test(first)) code = first;
        else if (/^[A-Z]{2,4}$/.test(first)) {
          const sem = (students.find(s => (s.kelas || '').trim().toUpperCase() === n)?.semester || '').toString().trim();
          code = first + sem;
        }
        if (!code) continue;
        const className = n;
        const id = slug(`${code}_${className}_Isnin`);
        if (existing.has(id)) continue;
        if (existingNames.has(normKlas(className))) continue;
        const subjName = (students.filter(s => (s.kelas || '').trim() === n).map(s => s.subjek).find(Boolean)) || '';
        await setDoc(doc(db, 'classes', id), { code, subjName, className, lecturer: lecturerName || '', day: 'Isnin', startTime: '08:00', endTime: '10:00', durationHours: 2, room: '' });
        created++;
      }
      if (created) await loadClasses();
    } catch (e) { console.error('Gagal auto-cipta kelas', e); }
  }, [loadClasses]);

  const loadStudents = useCallback(async () => {
    const lect = currentLecturer;
    const lname = lect && lect.name ? String(lect.name).trim().toUpperCase() : '';
    if (!lname) return;
    try {
      const url = SUPABASE_URL + '/rest/v1/students?select=*&order=no_matrik.asc';
      const res = await fetch(url, { headers: { 'apikey': SUPABASE_PUBLISHABLE_KEY, 'Authorization': 'Bearer ' + SUPABASE_PUBLISHABLE_KEY } });
      if (!res.ok) throw new Error('Supabase HTTP ' + res.status);
      const data = await res.json();
      const all = (Array.isArray(data) ? data : []).map(normalizeStudent).filter(Boolean);
      const mine = all.filter(s => String(s.source_name || '').trim().toUpperCase() === lname);
      studentFilterRef.current = mine;
      setStudents(mine);
      await autoCreateClasses(mine, lect.name);
      await loadClasses();
    } catch (e) {
      console.error('Gagal load students:', e);
      setStudents([]);
      studentFilterRef.current = [];
      await loadClasses();
    }
  }, [currentLecturer, autoCreateClasses, loadClasses]);

  const handleLogout = () => {
    clearCurrentLecturer();
    studentFilterRef.current = [];
    setCurrentLecturer(null);
    setStudents([]); setClasses([]); setActiveClassId(null);
    setSessionsMap({}); setSelSessionMap({}); setAttMap({});
  };

  const handleLogin = (lecturer) => {
    setStudents([]); setClasses([]); setActiveClassId(null);
    setSessionsMap({}); setSelSessionMap({}); setAttMap({});
    studentFilterRef.current = [];
    setCurrentLecturer(lecturer);
  };

  useEffect(() => {
    if (!currentLecturer) return;
    setLoaded(false);
    loadStudents().then(() => setLoaded(true));
  }, [currentLecturer, loadStudents]);

  // ---- Realtime: classes ----
  useEffect(() => {
    const unsub = onSnapshot(collection(db, 'classes'), snap => {
      const arr = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      const filtered = filterClassesForLecturer(arr);
      setClasses(filtered);
      if (filtered.length) setActiveClassId(cur => (cur && filtered.find(c => c.id === cur) ? cur : filtered[0].id));
      else setActiveClassId(null);
    }, err => console.error('Gagal muat kelas (realtime)', err));
    return () => unsub();
  }, [filterClassesForLecturer]);

  // ---- Realtime: sessions utk kelas aktif ----
  useEffect(() => {
    if (!activeClassId) return;
    const unsub = onSnapshot(
      query(collection(db, 'sessions'), where('classId', '==', activeClassId), orderBy('createdAt', 'desc'), limit(100)),
      snap => {
        const arr = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(s => attOwnedByLecturer(s, lecturerRef.current));
        setSessionsMap(m => ({ ...m, [activeClassId]: arr }));
        const active = arr.find(s => !s.archived) || arr[0];
        setSelSessionMap(m => (m[activeClassId] && arr.find(s => s.id === m[activeClassId]) ? m : { ...m, [activeClassId]: active ? active.id : null }));
      },
      err => console.error('Gagal muat sesi (realtime)', err)
    );
    return () => unsub();
  }, [activeClassId]);

  // ---- Auto-cipta sesi hari ini (doc id SAMA dgn index.html) ----
  useEffect(() => {
    if (!activeClassId) return;
    const cls = classes.find(c => c.id === activeClassId);
    if (!cls) return;
    const list = sessionsMap[activeClassId] || [];
    const today = new Date().toISOString().slice(0, 10);
    if (list.some(s => !s.archived && s.date === today)) return;
    let alive = true;
    (async () => {
      try {
        const startTime = nowHHMM();
        const endTime = addHours(startTime, cls.durationHours || 2);
        const id = slug(activeClassId + '-' + today);
        await setDoc(doc(db, 'sessions', id), {
          classId: activeClassId, className: classLabel(cls), date: today,
          startTime, endTime, createdAt: serverTimestamp(), archived: false, auto: true,
          lecturer_no_gaji: (lecturerRef.current && lecturerRef.current.noGaji) || '',
          lecturer_name: (lecturerRef.current && lecturerRef.current.name) || ''
        });
        if (!alive) return;
        setSessionsMap(m => ({ ...m, [activeClassId]: [{ id, classId: activeClassId, className: classLabel(cls), date: today, startTime, endTime, archived: false, createdAt: new Date(), auto: true, lecturer_no_gaji: (lecturerRef.current && lecturerRef.current.noGaji) || '', lecturer_name: (lecturerRef.current && lecturerRef.current.name) || '' }, ...(m[activeClassId] || [])] }));
        setSelSessionMap(m => ({ ...m, [activeClassId]: id }));
      } catch (e) { console.error('Gagal auto-cipta sesi', e); }
    })();
    return () => { alive = false; };
  }, [activeClassId, classes, sessionsMap]);

  // ---- Realtime: attendance utk sesi aktif ----
  useEffect(() => {
    const sessionId = selSessionMap[activeClassId];
    if (!activeClassId || !sessionId) return;
    const unsub = onSnapshot(
      query(collection(db, 'attendance'), where('sessionId', '==', sessionId)),
      snap => {
        const m = {};
        snap.docs.forEach(d => {
          const v = d.data();
          if (!v || !v.studentId) return;
          if (!attOwnedByLecturer(v, lecturerRef.current)) return;
          m[v.studentId] = { status: v.status || 'present', time: v.time || '' };
        });
        setAttMap(p => ({ ...p, [sessionId]: m }));
        setLive(true);
      }
    );
    return () => unsub();
  }, [activeClassId, selSessionMap, currentLecturer]);

  // ---- Scanner ----
  const getStudentById = sid => students.find(s => studentIdOf(s) === sid);

  const matchStudent = (sid, list) => {
    const q = String(sid || '').trim().toUpperCase();
    if (!q) return null;
    const qn = q.replace(/[^A-Z0-9]/g, '');
    const norm = s => String(s.id || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    let hit = list.find(s => String(s.id || '').toUpperCase() === q);
    if (hit) return hit;
    hit = list.find(s => norm(s) === qn);
    if (hit) return hit;
    return list.find(s => norm(s).includes(qn) || qn.includes(norm(s)));
  };

  const doMark = useCallback(async (sid, status) => {
    const classId = activeClassId;
    const sessionId = selSessionMap[classId];
    if (!classId || !sessionId) return { ok: false, msg: 'Tiada sesi aktif' };
    sid = String(sid).trim();
    const cls = classes.find(c => c.id === classId);
    const student = getStudentById(sid);
    const docId = sessionId + '_' + sid;
    try {
      const time = fmtClock(new Date());
      const lect = lecturerRef.current;
      await setDoc(doc(db, 'attendance', docId), {
        sessionId, classId, className: (cls && classLabel(cls)) || '', studentId: sid,
        studentName: student ? studentNameOf(student) : 'Tidak diketahui',
        status, time, timestamp: serverTimestamp(),
        lecturer_no_gaji: (lect && lect.noGaji) || '',
        lecturer_name: (lect && lect.name) || ''
      });
      return { ok: true, student };
    } catch (e) { return { ok: false, msg: e.message }; }
  }, [activeClassId, selSessionMap, classes, students]);

  const handleScanText = useCallback(async (text) => {
    const sid = String(text || '').trim();
    if (!sid) { setScanStatus('QR kosong — cuba lagi'); return; }
    const student = getStudentById(sid) || matchStudent(sid, students);
    const sessionId = selSessionMap[activeClassId];
    const cur = sessionId ? (attMap[sessionId] || {})[sid] : null;
    if (!student) {
      setScanStatus('✗ ID tidak dijumpai: ' + sid);
      playBeep(false);
      return;
    }
    if (cur && cur.status === 'present') {
      setScanStatus('✓ ' + (student.nickname || studentNameOf(student).split(' ')[0]) + ' sudah hadir');
      return;
    }
    const r = await doMark(student.id, 'present');
    if (r && r.ok) {
      setScanStatus('✓ ' + (student.nickname || studentNameOf(student).split(' ')[0]) + ' ditanda hadir');
      playBeep(true);
      toast('✓ ' + (student.nickname || studentNameOf(student).split(' ')[0]) + ' ditanda hadir', 'ok');
      setStampKey(k => k + 1); setStampOn(true);
      clearTimeout(stampTimer.current);
      stampTimer.current = setTimeout(() => setStampOn(false), 1100);
    } else {
      setScanStatus('Gagal: ' + ((r && r.msg) || 'ralat'));
      playBeep(false);
    }
  }, [activeClassId, selSessionMap, students, attMap, doMark]);

  useEffect(() => { scanHandlerRef.current = handleScanText; }, [handleScanText]);

  // ---- Bunyi beep (Web Audio, tanpa fail luaran) ----
  const ensureAudio = () => {
    try {
      if (!beepCtxRef.current) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        beepCtxRef.current = new AC();
      }
      if (beepCtxRef.current.state === 'suspended') beepCtxRef.current.resume();
      return beepCtxRef.current;
    } catch (e) { return null; }
  };
  const playBeep = (ok) => {
    try {
      const ctx = ensureAudio();
      if (!ctx) return;
      const t0 = ctx.currentTime;
      const mk = (freq, start, dur, type) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t0 + start);
        g.gain.exponentialRampToValueAtTime(0.35, t0 + start + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + start + dur);
        o.connect(g); g.connect(ctx.destination);
        o.start(t0 + start); o.stop(t0 + start + dur + 0.02);
      };
      if (ok) { mk(880, 0, 0.16, 'sine'); mk(1318.5, 0.14, 0.24, 'sine'); }
      else { mk(196, 0, 0.28, 'square'); }
    } catch (e) {}
  };
  useEffect(() => {
    if (beepUnlockedRef.current) return;
    const unlock = () => { beepUnlockedRef.current = true; ensureAudio(); };
    document.addEventListener('pointerdown', unlock, { once: true });
    document.addEventListener('touchstart', unlock, { once: true });
    return () => { document.removeEventListener('pointerdown', unlock); document.removeEventListener('touchstart', unlock); };
  }, []);

  const handleScanImage = async (files) => {
    if (!files || !files[0]) return;
    setScanStatus('Memproses gambar...');
    const qr = new Html5Qrcode('qr-img-reader');
    try {
      const text = await qr.scanFile(files[0], false);
      await handleScanText(text);
    } catch (e) { setScanStatus('QR tidak berjaya dibaca'); }
    finally { try { qr.clear(); } catch (e) {} }
  };

  const startScanner = useCallback(async () => {
    if (qrCodeRef.current) { try { await qrCodeRef.current.stop(); } catch (e) {} try { qrCodeRef.current.clear(); } catch (e) {} qrCodeRef.current = null; }
    if (!document.getElementById('qr-reader')) return;
    lastDecodeRef.current = { text: '', t: 0 };
    const qr = new Html5Qrcode('qr-reader');
    qrCodeRef.current = qr;
    setScanStatus('Arahkan QR pada kad pelajar ke kamera');
    try {
      await qr.start({ facingMode: 'environment' }, { fps: 8, qrbox: 240 },
        text => {
          const now = Date.now();
          const prev = lastDecodeRef.current;
          if (prev.text === text && now - prev.t < 1500) return;
          lastDecodeRef.current = { text, t: now };
          try { if (qr.getState() === 2) qr.pause(); } catch (e) {}
          const fn = scanHandlerRef.current;
          if (fn) fn(text).catch(() => {}).finally(() => setTimeout(() => {
            try { if (qr.getState() === 3) qr.resume(); } catch (e) {}
          }, 350));
        },
        () => {}
      );
    } catch (err) {
      qrCodeRef.current = null;
      setScanStatus('Gagal buka kamera: ' + err);
    }
  }, []);

  const stopScanner = useCallback(async () => {
    const q = qrCodeRef.current;
    qrCodeRef.current = null;
    if (!q) return;
    try { await q.stop(); } catch (e) {}
    try { q.clear(); } catch (e) {}
  }, []);

  useEffect(() => {
    if (!scannerOpen) return;
    startScanner();
    return () => { stopScanner(); };
  }, [scannerOpen, startScanner, stopScanner]);

  useEffect(() => {
    if (!scannerOpen) return;
    const onVis = () => {
      if (document.hidden) stopScanner();
      else setTimeout(startScanner, 150);
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, [scannerOpen, startScanner, stopScanner]);

  useEffect(() => {
    if (!scannerOpen) return;
    const t = setInterval(() => {
      const q = qrCodeRef.current;
      if (!q) return;
      try {
        const s = q.getState();
        const idle = Date.now() - lastDecodeRef.current.t;
        if (s !== 2 || idle > 10000) { setScanStatus('Kamera terhenti — dimulakan semula…'); startScanner(); }
      } catch (e) {}
    }, 4000);
    return () => clearInterval(t);
  }, [scannerOpen, startScanner]);

  // ---- Derived ----
  const cls = classes.find(c => c.id === activeClassId);
  const sessionId = selSessionMap[activeClassId];
  const session = sessionId ? (sessionsMap[activeClassId] || []).find(s => s.id === sessionId) : null;
  const att = sessionId ? (attMap[sessionId] || {}) : {};
  const clsStudents = cls ? students.filter(s => stuInClass(cls, s)) : [];
  const pres = clsStudents.filter(s => (att[studentIdOf(s)] || {}).status === 'present');
  const tS = (session && session.startTime) || (cls && cls.startTime) || '08:00';
  const tE = (session && session.endTime) || (cls && cls.endTime) || '10:00';
  const sdate = (session && session.date) || new Date().toISOString().slice(0, 10);

  if (!currentLecturer) return html`<${LecturerLogin} onLogin=${handleLogin} />`;

  return html`
    <div className="min-h-screen bg-page text-ink font-sans flex flex-col no-tap">
      <!-- Header -->
      <div className="sticky top-0 z-40 bg-navy text-white px-4 pt-[max(14px,env(safe-area-inset-top))] pb-3 shadow-lg" style=${{background:'linear-gradient(150deg,#12284F 0%,#0F2344 100%)'}}>
        <div className="flex items-center gap-3">
          <div className="w-9 h-9 rounded-xl bg-white/10 border border-white/15 flex items-center justify-center">
            <${IC.ScanLine} className="w-5 h-5 text-blue-200" />
          </div>
          <div className="flex-1 min-w-0">
            <div className="text-[14px] font-bold leading-tight truncate">${currentLecturer.name}</div>
            <div className="text-blue-200/50 text-[11px]">No. Gaji ${currentLecturer.noGaji} · KPMIM</div>
          </div>
          <button onClick=${handleLogout} aria-label="Log keluar" className=${'w-9 h-9 rounded-xl bg-white/10 border border-white/15 flex items-center justify-center text-blue-100/70 hover:bg-white/20 transition-colors ' + FOCUS}>
            <${IC.LogOut} className="w-4 h-4" />
          </button>
        </div>
      </div>

      <!-- Class chips -->
      <div className="sticky top-[62px] z-30 bg-page/95 backdrop-blur px-3 pt-3 pb-2 overflow-x-auto scroll-thin">
        ${classes.length ? html`<div className="flex gap-2">
          ${classes.map(c => html`
            <button key=${c.id} onClick=${() => setActiveClassId(c.id)}
              className=${'h-9 px-4 rounded-full text-[12.5px] font-semibold whitespace-nowrap transition-colors ' + FOCUS + ' ' +
                (c.id === activeClassId ? 'bg-primary text-white shadow-[0_6px_14px_-6px_rgba(37,99,235,0.6)]' : 'bg-white border border-line text-muted')}>
              ${classLabel(c)}
            </button>`)}
        </div>` : null}
      </div>

      <div className="flex-1 px-4 pt-2 pb-28">
        ${!loaded ? html`
          <div className="flex flex-col items-center justify-center py-24 text-muted">
            <${IC.Loader2} className="w-7 h-7 animate-spin text-primary mb-3" />
            <span className="text-[13px]">Memuat data…</span>
          </div>`
        : !classes.length ? html`
          <div className="flex flex-col items-center justify-center py-24 text-center px-6">
            <div className="w-14 h-14 rounded-2xl bg-primary/10 flex items-center justify-center text-primary mb-3"><${IC.ScanLine} className="w-7 h-7" /></div>
            <div className="text-[15px] font-bold text-navy">Tiada kelas</div>
            <p className="text-[12px] text-muted mt-1">Tiada kelas dijumpai untuk pensyarah ini. Pastikan data pelajar di Supabase betul.</p>
          </div>`
        : cls ? html`
          <!-- Session card -->
          <div className="bg-white rounded-2xl border border-line shadow-sm p-4">
            <div className="flex items-center gap-1.5 text-[11px] font-semibold text-muted">
              <${live ? IC.Wifi : IC.WifiOff} className="w-3.5 h-3.5 ${live ? 'text-success' : 'text-muted'}" />
              ${live ? 'Sinkron masa nyata' : 'Menunggu data…'}
            </div>
            <div className="text-[17px] font-extrabold text-navy mt-1 truncate">${classLabel(cls)}</div>
            <div className="text-[12px] text-muted mt-0.5">${fmtDate(new Date(sdate + 'T00:00:00'))} · ${tS}–${tE}${session ? '' : ' · sesi auto'}</div>
            <div className="mt-3 grid grid-cols-2 gap-2">
              <div className="rounded-xl bg-success/5 border border-success/20 px-3 py-2.5 text-center">
                <div className="text-[28px] font-extrabold text-success font-mono leading-none">${pres.length}</div>
                <div className="text-[10px] text-muted font-semibold uppercase tracking-wide mt-1">Hadir</div>
              </div>
              <div className="rounded-xl bg-page border border-line px-3 py-2.5 text-center">
                <div className="text-[28px] font-extrabold text-ink font-mono leading-none">${clsStudents.length}</div>
                <div className="text-[10px] text-muted font-semibold uppercase tracking-wide mt-1">Jumlah</div>
              </div>
            </div>
          </div>

          <!-- Live list -->
          <div className="mt-4">
            <div className="text-[12px] font-bold text-navy mb-2">Kehadiran Masa Nyata ${pres.length ? html`· <span className="text-success">${pres.length} hadir</span>` : ''}</div>
            ${pres.length ? html`
              <div className="space-y-1.5">
                ${pres.slice(0, 200).map((s, i) => {
                  const a = att[studentIdOf(s)] || {};
                  return html`
                    <div key=${studentIdOf(s)} className="flex items-center gap-3 bg-white border border-success/25 rounded-xl px-3 py-2.5">
                      <div className="w-9 h-9 rounded-full bg-gradient-to-br from-blue-100 to-blue-200 flex items-center justify-center text-[12px] font-bold text-primary font-mono shrink-0">${ini(studentNameOf(s))}</div>
                      <div className="flex-1 min-w-0">
                        <div className="text-[13px] font-semibold text-ink truncate">${studentNameOf(s)}</div>
                        <div className="text-[11px] text-muted font-mono truncate">${studentIdOf(s)}</div>
                      </div>
                      <div className="flex items-center gap-1 text-[11px] font-medium text-success shrink-0"><${IC.CheckCircle2} className="w-4 h-4" /> ${a.time || ''}</div>
                    </div>`;
                })}
              </div>`
            : html`
              <div className="bg-white border border-line rounded-xl px-4 py-8 text-center">
                <div className="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary mx-auto mb-2"><${IC.ScanLine} className="w-6 h-6" /></div>
                <div className="text-[13px] font-semibold text-ink">Belum ada kehadiran</div>
                <p className="text-[11px] text-muted mt-0.5">Tekan butang Scan QR di bawah untuk mula.</p>
              </div>`}
          </div>`
        : null}
      </div>

      <!-- Big scan button (fixed bottom) -->
      <div className="fixed bottom-0 left-0 right-0 z-40 px-4 pb-[max(16px,env(safe-area-inset-bottom))] pt-3 bg-gradient-to-t from-page via-page/95 to-transparent">
        <button onClick=${() => { if (!sessionId) { toast('Tiada sesi aktif — cuba lagi sebentar', 'warn'); return; } setScanStatus('Arahkan QR pada kad pelajar ke kamera'); setScannerOpen(true); }}
          className="w-full h-[58px] rounded-2xl bg-primary text-white text-[16px] font-bold flex items-center justify-center gap-2.5 shadow-[0_10px_24px_-8px_rgba(37,99,235,0.7)] active:scale-[0.98] transition-transform">
          <${IC.ScanLine} className="w-6 h-6" /> Scan QR
        </button>
      </div>

      ${scannerOpen ? html`<${ScannerModal} status=${scanStatus} count=${pres.length} onManualId=${async id => { const v = (id || '').trim(); if (v) await handleScanText(v); const el = document.getElementById('manual-id'); if (el) el.value = ''; }} onScanImage=${handleScanImage} onClose=${() => setScannerOpen(false)} />` : null}
      ${stampOn ? html`<div key=${stampKey} className="stamp">HADIR ✓</div>` : null}
      <${Toast} msg=${toastMsg} />
    </div>`;
}

const app = initializeApp(FIREBASE_CONFIG);
const db = getFirestore(app);
const root = createRoot(document.getElementById('root'));
root.render(html`<${App} />`);
</script>
</body>
</html>
